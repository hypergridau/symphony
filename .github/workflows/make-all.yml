name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify make all
        run: make all

      - name: Build the disposable worker image
        run: docker build --file worker-image/Dockerfile --tag symphony-worker:ci ..

  hgs740-root-fixture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build isolated HGS-740 root fixture image
        run: docker build --file elixir/test/root_fixtures/Dockerfile --tag symphony-hgs740-root-fixture:ci .

      - name: Exercise root-only on-disk recovery and denial paths
        run: >-
          docker run --rm --network none --user 0:0
          --tmpfs /srv:rw,nosuid,nodev,mode=0700
          --tmpfs /tmp:rw,nosuid,nodev,mode=1777
          symphony-hgs740-root-fixture:ci
